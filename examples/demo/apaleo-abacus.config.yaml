# Konfiguration von "apaleo-abacus export --demo". Die Demo liest nur diese
# Datei, nie deine eigene Konfiguration oder Umgebung. Das Hotel ist erfunden:
# importiere eine Demo-Datei nie in einen echten Abacus-Mandanten.
abacus:
  mandant: 7777
  # Die Demo-Daten buchen noch in EUR.
  leitwaehrung: EUR
properties:
  - id: BSP
    # Relativ zu diesem Ordner (examples/demo/).
    mapping: mapping-BSP.csv
